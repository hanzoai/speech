[project]
name = "speech"
version = "0.1.11"
description = "CPU speech: STT (faster-whisper) + TTS (kokoro) behind one OpenAI-shaped surface"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.4",
  "soundfile>=0.13",
  # Raw audio is handed to the model as an array, so this is imported directly
  # rather than reached through faster-whisper.
  "numpy>=2.0",
]

# The suite stubs the two model calls, so it needs neither weights nor a GPU and
# runs in seconds — which is what lets CI gate on it. httpx is what FastAPI's
# TestClient drives the app through.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
]
